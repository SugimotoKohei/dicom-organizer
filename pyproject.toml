[build-system]
requires = ["setuptools>=75.6"]
build-backend = "setuptools.build_meta"

[project]
name = "organize-dicoms"
version = "0.1.0"
description = "Local DICOM organizer with CLI and optional PySide6 GUI"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydicom>=3.0.1",
]

[project.optional-dependencies]
gui = [
    "pyside6>=6.11.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[project.scripts]
organize-dicoms = "organize_dicoms.cli:main"
organize-dicoms-gui = "organize_dicoms.gui:main"
dicom-organizer = "organize_dicoms.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["organize_dicoms*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
