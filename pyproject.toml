[build-system]
requires = ["setuptools>=75.6"]
build-backend = "setuptools.build_meta"

[project]
name = "dicom-organizer"
version = "0.1.0"
description = "Local DICOM organizer with CLI and optional PySide6 GUI"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Kohei Sugimoto" },
]
maintainers = [
    { name = "Kohei Sugimoto" },
]
keywords = [
    "dicom",
    "mri",
    "medical-imaging",
    "pydicom",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Utilities",
]
dependencies = [
    "pydicom>=3.0.1",
]

[project.urls]
Homepage = "https://github.com/SugimotoKohei/dicom-organizer"
Repository = "https://github.com/SugimotoKohei/dicom-organizer"
Issues = "https://github.com/SugimotoKohei/dicom-organizer/issues"
Changelog = "https://github.com/SugimotoKohei/dicom-organizer/blob/main/CHANGELOG.md"

[project.optional-dependencies]
gui = [
    "pyside6>=6.11.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[project.scripts]
dicom-organizer = "dicom_organizer.cli:main"
dicom-organizer-gui = "dicom_organizer.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dicom_organizer*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
