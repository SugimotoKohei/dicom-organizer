name: Standalone Build

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/build_standalone.py"
      - ".github/workflows/standalone.yml"
      - "src/dicom_organizer/gui.py"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --extra gui --group build

      # Standalone build and signing note:
      # - macOS notarization uses xcrun notarytool and codesign when MACOS_CERTIFICATE_P12_BASE64 is provided.
      # - Windows signing uses signtool when WINDOWS_CERTIFICATE_PFX_BASE64 is provided.
      # - If secrets are omitted, scripts/build_standalone.py leaves packages unsigned / ad-hoc signed.
      - name: Build standalone package and run smoke test
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: uv run python scripts/build_standalone.py --smoke-test

      - name: Upload standalone artifacts
        uses: actions/upload-artifact@v7
        with:
          name: standalone-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            dist/standalone/*.zip
            dist/standalone/SHA256SUMS.txt
